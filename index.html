<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DrawHere</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div>
      <input type="color" id="colorPicker" />
      <label for="colorPicker">Color</label>
    </div>
    <div>
      <input type="range" id="brushSize" min="1" max="50" value="5" />
      <span id="displaySize">5</span>
    </div>
    <button class="tool" id="brush">brush</button>
    <button class="tool" id="eraser">eraser</button>
    <button class="tool" id="clear">clear</button>
    <canvas id="firstCanvas" width="1000" height="1000">not working</canvas>
    <script src="script.js"></script>
  </body>
</html>
